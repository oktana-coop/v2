name: Publish Packages
on:
  release:
    types: [published]

jobs:
  publish-ubuntu:
    runs-on: ubuntu-latest
    env:
      APT_BUCKET: v2-apt
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Import GPG key
        run: |
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --list-secret-keys

      - name: Generate APT repository
        env:
          GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          chmod +x ./scripts/ubuntu/generate-apt-repo.sh
          ./scripts/ubuntu/generate-apt-repo.sh ${{ github.event.release.tag_name }}

      - name: Upload APT repository to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # The bucket is assumed to be in the EU jurisdiction
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          # Uploads in three steps, so that a user running apt during an upload
          # never gets an index that disagrees with the packages.

          # 1. Upload the new packages to pool/, keeping the old ones (the current index still points at them).
          aws s3 sync apt-repo/pool "s3://$APT_BUCKET/pool"

          # 2. Upload the index and public.key with Cache-Control: no-cache, so Cloudflare doesn't serve a stale Packages.gz.
          aws s3 sync apt-repo "s3://$APT_BUCKET" --exclude "pool/*" --delete --cache-control "no-cache"

          # 3. Delete the old packages from pool/, which nothing points at anymore.
          aws s3 sync apt-repo/pool "s3://$APT_BUCKET/pool" --delete
